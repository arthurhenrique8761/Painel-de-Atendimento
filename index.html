<!DOCTYPE html>

<html lang="en">

<head>

    <!-- Site: Painel de Atendimento Médico -->
    <!-- Criado por: Arthur Henrique Monteiro Pereira, David Henrique Fonseca Ramos, Wylliam Rocha da Silva, Eduardo Oliveira da Silva -->
    <!-- Data: 06/04/2026 -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <h1>ATENDIMENTO MÉDICO</h1>

    <div class="container">

        <!-- Painel de senha atual -->
        <div class="block" id="painelAtual">
            <div class="blockHeader" id="green">
                <h2>Senha Atual</h2>
            </div>
            <div class="blockContent">
                <p id="senhaAtual" style="font-size: 3rem; text-align: center; font-weight: bold;"></p>
            </div>
        </div>

        <!-- Gerador de senhas -->
        <div class="block">
            <div class="blockHeader" id="blue" >
                <h2>Gerador</h2>
            </div>
            <div class="blockContent" id="senhas">
                <button onclick="gerarSenha()">Gerar Senha</button>
            </div>
        </div>

        <!-- Mídia -->
        <div class="block">
            <div class="blockHeader" id="grey">
                <h2>Mídia</h2>
            </div>
            <div class="blockContent">
                <div class="carousel">
                    <video class="video active" src="./assets/videos/hospital1.mp4" muted></video>
                    <video class="video" src="./assets/videos/hospital2.mp4" muted></video>
                    <video class="video" src="./assets/videos/hospital3.mp4" muted></video>
                </div>
            </div>
        </div>

        <!-- Painel de Ultimas chamadas -->
        <div class="block">
            <div class="blockHeader" id="yellow">
                <h2>Ultimas chamadas</h2>
            </div>
            <div class="blockContent">
                <ul id="historico" style="list-style: none; padding: 0; font-size: 1.2rem; font-weight: bold;"></ul>
            </div>
        </div>

    </div>
    
<script src="./script.js"></script>
</body>

</html>
